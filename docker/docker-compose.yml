services:
  vllm_retrieval:
    image: vllm_mistral_server
    container_name: rag_vllm_isolated
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    environment:
      - VLLM_TARGET_GPU_MEMORY_GB=6  
    restart: always
    runtime: nvidia 
    ports:
      - "9005:8005"  
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Map the host's model folder directly into the container's /models directory
      - /home/android/Documents/abhay/models/Mistral-7B-Instruct-v0.2-AWQ:/models/Mistral-7B-Instruct-v0.2-AWQ
    command:
      - sh
      - -c
      - |
        TOTAL_MB=$$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -n1 | tr -d ' ')
        TARGET_MB=$$(( $${VLLM_TARGET_GPU_MEMORY_GB:-8} * 1024 ))
        UTIL=$$(awk "BEGIN {printf \"%.2f\", $$TARGET_MB / $$TOTAL_MB}")
        exec python3 -m vllm.entrypoints.openai.api_server \
          --host 0.0.0.0 \
          --port 8005 \
          --model /models/Mistral-7B-Instruct-v0.2-AWQ \
          --served-model-name mistral-local \
          --quantization awq \
          --dtype float16 \
          --max-model-len 8192 \
          --max-num-seqs 20 \
          --gpu-memory-utilization $${UTIL} \
          --enforce-eager
  
  calendar_mcp:
    image: calendar_mcp:v1
    container_name: calendar_mcp_container
    build:
      context: ..
      dockerfile: docker/Dockerfile.calendar_tool
    restart: always
    ports: 
      - "8090:8090"
    environment:
      - TZ=Asia/Kolkata  
    volumes:
      - ../app/google_calendar_mcp_server.py:/app/google_calendar_mcp_server.py
      - /home/android/Documents/vihang/POC_RAG_PLUS/tool_calling/Project-v2/.\/.credentials.json:/app/credentials.json
      - /home/android/Documents/vihang/POC_RAG_PLUS/tool_calling/Project-v2/.creds/.token.json:/app/token.json 
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro  

  api_retrieval:
    image: rag_api:v3
    container_name: rag_api_isolated
    build:
      context: ..
      dockerfile: docker/Dockerfile.retrieval
    runtime: nvidia  
    depends_on:
      - vllm_retrieval
      - calendar_mcp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]  
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SURREAL_URL=ws://host.docker.internal:19521/rpc
      - VLLM_URL=http://vllm_retrieval:8005/v1  
      - HF_HOME=/models/hf_cache
    # Add this line to force instant, unbuffered log printing:
      - PYTHONUNBUFFERED=1  
      - HF_TOKEN=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
      - calendar_MCP_URL=http://calendar_mcp:8090/sse
      - TZ=Asia/Kolkata
    ports:
      - "9001:9001"  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../app:/app
      - ../logs:/logs
      - ../certs:/certs:ro
      - /home/android/Documents/abhay/models/nllb_ctranslate2:/models/nllb_ctranslate2
      - /home/android/Documents/abhay/models/hf_cache:/models/hf_cache
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command:
      - uvicorn
      - main:api
      - --host
      - "0.0.0.0"
      - --port
      - "9001"
      - --ssl-keyfile
      - /certs/key.pem
      - --ssl-certfile
      - /certs/cert.pem

 
networks:
  default:
    name: data_retrival_network
    driver: bridge